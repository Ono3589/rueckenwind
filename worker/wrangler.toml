# Cloudflare Worker für die Morgenmeldung. Anleitung: README.md im Hauptordner, Abschnitt „Morgenmeldung“.
name = "rueckenwind-push"
main = "src/index.js"
compatibility_date = "2025-09-01"

[triggers]
# alle 15 Minuten prüfen; gesendet wird einmal pro Tag nach der Wunschzeit
crons = ["*/15 * * * *"]

[vars]
# Nur diese Webseite darf den Dienst ansprechen (deine GitHub-Pages-Adresse, ohne Pfad)
ALLOWED_ORIGINS = "https://ono3589.github.io"
# Wer sendet? Muss eine https- oder mailto-Adresse sein. Keine privaten Daten eintragen.
VAPID_SUBJECT = "https://ono3589.github.io/rueckenwind/"
# Hierhin kehrt der Browser nach der Bosch-Anmeldung zurück
APP_URL = "https://ono3589.github.io/rueckenwind/"

[[kv_namespaces]]
binding = "SUBS"
id = "cc3eace6b04e418ab4e00ee833796adc"

# Geheimnisse legst du NICHT in dieser Datei ab, sondern mit `npx wrangler secret put <NAME>`:
#   VAPID_PUBLIC       öffentlicher Schlüssel (aus gen-vapid.mjs)
#   VAPID_PRIVATE_JWK  privater Schlüssel (aus gen-vapid.mjs)
#   API_TOKEN          langes Zufalls-Passwort, das du auch in der App einträgst
#   BOSCH_KEY          Zufallsschlüssel, mit dem die Bosch-Tokens verschlüsselt werden (setup-secrets.mjs bosch)
